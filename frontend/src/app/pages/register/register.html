<div class="register-page">
  <div class="register-card">
    
    <div class="brand">FinLead<span>  AI</span></div>

    <div class="welcome">
      <span class="eyebrow">CREATE YOUR ACCOUNT</span>
      <h1>Welcome to FinLeadAI</h1>
      <p>Start making smarter financial decisions with AI.</p>
    </div>

    <form (submit)="$event.preventDefault()">

      <div class="form-group">
        <label for="fullName">Full name</label>
        <input
          id="fullName"
          type="text"
          name="fullName"
          placeholder="Enter your full name"
          autocomplete="name"
          required
        />
      </div>

      <div class="form-group">
        <label for="email">Email address</label>
        <input
          id="email"
          type="email"
          name="email"
          placeholder="you@example.com"
          autocomplete="email"
          required
        />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input
          id="password"
          type="password"
          name="password"
          placeholder="Create a password"
          autocomplete="new-password"
          minlength="8"
          required
        />
        <small>Use at least 8 characters.</small>
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirm password</label>
        <input
          id="confirmPassword"
          type="password"
          name="confirmPassword"
          placeholder="Re-enter your password"
          autocomplete="new-password"
          required
        />
      </div>

      <button class="register-button" type="submit">
        Create account <span>→</span>
      </button>

    </form>

    <p class="signin-text">
      Already have an account?
      <a routerLink="/login">Sign in</a>
    </p>

    <p class="secure-note">
      <span>🔒</span> Your information is protected.
    </p>

  </div>
</div>
